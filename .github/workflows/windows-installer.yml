# Builds EmotionOverlay-Setup-<version>.exe and tests it on a clean Windows machine.
# The installer is unsigned, so nothing is uploaded or published: the build is a check only.
name: Windows installer

on:
  push:
    paths:
      - "packaging/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PYTHONIOENCODING: utf-8
      APP_EXE: ${{ github.workspace }}\dist\EmotionOverlay\EmotionOverlay.exe
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group build

      - name: Unit tests
        run: uv run python -m pytest -q

      - name: Work out version
        id: version
        run: |
          $v = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build app bundle (PyInstaller)
        run: uv run python -m PyInstaller packaging/emotion_overlay.spec --noconfirm

      - name: Self-test bundle (downloads models, faster-whisper)
        run: |
          & $env:APP_EXE --self-test
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Self-test bundle (transformers Whisper, the Smart App Control fallback)
        run: |
          $cfg = Join-Path $env:RUNNER_TEMP "fallback.yaml"
          "asr:`n  backend: transformers`n" | Set-Content -Encoding utf8 $cfg
          & $env:APP_EXE --self-test --config $cfg
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Serve the web UI from the bundle
        run: |
          $p = Start-Process $env:APP_EXE -ArgumentList "--no-audio", "--no-open-browser" -PassThru
          $pages = "/setup", "/overlay", "/static/common/socket.js"
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try {
              foreach ($page in $pages) {
                $r = Invoke-WebRequest "http://127.0.0.1:8765$page" -UseBasicParsing
                if ($r.StatusCode -ne 200) { throw "$page returned $($r.StatusCode)" }
              }
              $ok = $true
            } catch { }
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Write-Error "web UI did not come up"; exit 1 }
          Write-Host "Served $($pages -join ', ')"

      - name: Build installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist\EmotionOverlay-Setup-*.exe | ForEach-Object { "{0} {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Install, self-test the installed app, uninstall
        run: |
          $env:INSTALLED_EXE = "$env:LOCALAPPDATA\Programs\Emotion Overlay\EmotionOverlay.exe"
          $setup = (Get-ChildItem dist\EmotionOverlay-Setup-*.exe | Select-Object -First 1).FullName
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait
          if (-not (Test-Path $env:INSTALLED_EXE)) { Write-Error "not installed where expected"; exit 1 }
          & $env:INSTALLED_EXE --self-test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "$env:LOCALAPPDATA\EmotionOverlay")) { Write-Error "user folder missing"; exit 1 }
          $dir = Split-Path $env:INSTALLED_EXE
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $env:INSTALLED_EXE) { Write-Error "uninstall left the app behind"; exit 1 }
