[project]
name = "emotion-overlay"
version = "0.1.0"
description = "Local speech emotion detection that swaps your stream overlay image."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",  # OBS remote control (also used by uvicorn)
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pillow>=10.3",
    "sounddevice>=0.4.7",
    "faster-whisper>=1.1",
    "silero-vad>=5.1",
    "transformers>=4.44",
    "torch>=2.3",
]

[project.optional-dependencies]
# NVIDIA GPU support (Windows/Linux): `uv sync --extra gpu`, about 3 GB. Then pick
# "GPU" on the setup page. Without it, PyTorch is the CPU-only build.
gpu = ["torch>=2.3"]
# AMD GPU support on Linux (ROCm 7.2; Radeon RX 7000/9000 and supported Instinct cards):
# `uv sync --extra amd`. On Windows, AMD's own builds are installed by run-amd.bat.
amd = ["torch>=2.3", "triton-rocm; sys_platform == 'linux'"]
# CPU only. On Windows and macOS that's the default anyway. On Linux, PyPI's PyTorch
# bundles NVIDIA's CUDA libraries (~4 GB more), so use `uv sync --extra cpu` there.
cpu = ["torch>=2.3"]

[project.scripts]
emotion-overlay = "emotion_overlay.main:main"

[dependency-groups]
build = [
    "pyinstaller>=6.11",
]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }, { extra = "amd" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "gpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-rocm72", extra = "amd", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
]
# The ROCm PyTorch build needs AMD's Triton, which is only on PyTorch's ROCm index.
triton-rocm = [{ index = "pytorch-rocm72", extra = "amd", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"  # CUDA 13 builds; cover RTX 50-series (Blackwell) and older cards
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"  # CPU-only builds, for Linux (PyPI's Linux build includes CUDA)
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm72"  # AMD ROCm 7.2 builds (Linux only)
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emotion_overlay"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
# S311: `random` is used to pick overlay images, not for security.
ignore = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["emotion_overlay", "conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
